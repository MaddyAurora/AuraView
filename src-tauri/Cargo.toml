[package]
name = "auraview"
version = "0.1.5"
description = "AuraView: Lightweight Custom Browser for Local AI Applications"
authors = ["MaddyAurora"]
edition = "2021"

[lib]
name = "auraview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
