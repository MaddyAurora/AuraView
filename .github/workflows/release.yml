name: Build and Release AuraView

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows EXE and MSI installers
        run: npm run tauri -- build --bundles nsis,msi

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraView-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object FullName
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object FullName
          )
          if ($files.Count -lt 2) { throw "Expected both EXE and MSI installers." }
          gh release create "$env:TAG" $files --title "AuraView $env:TAG" --notes-file ".github/RELEASE_NOTES.md" --verify-tag
