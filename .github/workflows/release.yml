name: Build and Release AuraView

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release tag (e.g. v0.3.4); leave blank for a test build'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        if: inputs.release_version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_VERSION -ne "v$version") {
            throw "Release tag must be v$version (received $env:RELEASE_VERSION)"
          }

      - name: Build Windows EXE and MSI installers
        run: npm run tauri -- build --bundles nsis,msi

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraView-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_version || github.ref_name }}
        run: |
          $files = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object FullName
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object FullName
          )
          if ($files.Count -lt 2) { throw "Expected both EXE and MSI installers." }
          gh release create "$env:TAG" $files --title "AuraView $env:TAG" --notes-file ".github/RELEASE_NOTES.md" --target "$env:GITHUB_SHA"
